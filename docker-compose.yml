services:
  pdf-service:
    container_name: pdf-service
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/pdf-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    privileged: false
    user: app-user
    ports:
      - 3004:8000
    environment:
      PDF_SERVICE_PORT: 8000
    volumes:
      - goss-bin:/goss-bin:ro

  pdf-service-test:
    container_name: pdf-service-test
    image: pdf-service:test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    privileged: false
    depends_on:
      - pdf-service-test-static-server
    working_dir: /app
    volumes:
      - "./coverage:/app/coverage"
      - "./test-results:/app/test-results"

  pdf-service-test-static-server:
    container_name: static-server
    image: docker.io/nginx:latest@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    volumes:
      - "./src/baseline/remote_image.jpg:/usr/share/nginx/html/remote_image.jpg"

  go-lint:
    image: golangci/golangci-lint:v2.12.2@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint:/root/.cache
    command: golangci-lint run -v --timeout 5m

  gosec:
    image: securego/gosec:2.24.6@sha256:2cf71ea78210c496c65e3a987576a9c8317b68e20f2960520b3f6f8f9f539be5
    working_dir: /app
    volumes:
      - .:/app
    command: -conf=/app/.gosec.json -exclude-dir=.cache -exclude-generated -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  goss:
    image: ghcr.io/goss-org/goss@sha256:8d3924f722a04a660e9e6c2403be0399d737c0187fc065714d26b992286c3f0a
    entrypoint: ["sh", "-c", "cp /usr/bin/goss /goss-bin/goss && cp /goss-src/goss.yaml /goss-bin/goss.yaml"]
    volumes:
      - goss-bin:/goss-bin
      - ./test/goss.yaml:/goss-src/goss.yaml:ro

  weasyprint:
    build:
      context: ./spike/weasyprint
    ports:
      - 5001:5000
    volumes:
      - ./spike/output:/output

volumes:
  goss-bin:
