name: WeasyPrint Spike (comparison)

on:
  workflow_dispatch:
  push:
    branches:
      - SP-4076

permissions:
  contents: read

jobs:
  compare:
    name: Render Chromium vs WeasyPrint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render baseline fixtures through both engines
        run: make weasyprint-spike

      - name: Upload comparison output
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weasyprint-comparison
          path: spike/output
          if-no-files-found: warn
