on:
  workflow_call:

jobs:
  test:
    name: Test PDF Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Linting
        run: |
          make lint-test

      - name: Run Security Scan (gosec)
        run: |
          make gosec

      - name: Upload gosec SARIF to GitHub Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: test-results/gosec.sarif

      - name: Run Unit Tests & Generate Coverage Report
        run: |
          make unit-test-coverage

      - name: Upload Junit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: |
            test-results/junit

      - name: Upload Image Diff Data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-image-diff
        with:
          name: image-diff
          path: |
            test-results/images

      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage
